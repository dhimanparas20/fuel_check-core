services:
  web:
    build: .
    container_name: fuel_check
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping/"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ./entrypoint.sh
