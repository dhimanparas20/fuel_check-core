{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Check | Login</title>
    <link href="{% static 'css/login.css' %}" rel="stylesheet">
</head>
<body class="auth-page">
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-icon" aria-hidden="true">⛽</span>
            <span class="brand-name">Fuel Check</span>
        </div>
        <div class="auth-switch" role="tablist">
            <button type="button" class="auth-switch-btn active" data-view="login" aria-selected="true">Sign In</button>
            <button type="button" class="auth-switch-btn" data-view="register" aria-selected="false">Create Account</button>
        </div>
        <section class="auth-forms" data-active="login">
            <form id="loginForm" class="auth-form is-active" data-view="login" autocomplete="off" novalidate>
                <h2 class="auth-title">Welcome back</h2>
                <p class="auth-copy">Use your account email and password to continue.</p>
                <label class="field">
                    <span class="field-label">Email</span>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">@</span>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">*</span>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="field-eye" data-toggle-password="loginPassword" aria-label="Show password">
                            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a17.8 17.8 0 0 1 5.06-5.94"/><path d="M1 1l22 22"/><path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88"/></svg>
                        </button>
                    </div>
                </label>
                <button type="submit" class="primary-btn">Sign In</button>
                <div id="loginError" class="auth-error d-none" role="alert"></div>
            </form>

            <form id="registerForm" class="auth-form" data-view="register" autocomplete="off" novalidate>
                <h2 class="auth-title">Create account</h2>
                <p class="auth-copy">Fill in your details and you’ll be ready to track in a minute.</p>
                <div class="field-row">
                    <label class="field">
                        <span class="field-label">First name</span>
                        <div class="field-control">
                            <input type="text" id="registerFirstName" placeholder="Aisha" required autocomplete="given-name">
                        </div>
                    </label>
                    <label class="field">
                        <span class="field-label">Last name</span>
                        <div class="field-control">
                            <input type="text" id="registerLastName" placeholder="Singh" required autocomplete="family-name">
                        </div>
                    </label>
                </div>
                <label class="field">
                    <span class="field-label">Email</span>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">@</span>
                        <input type="email" id="registerEmail" placeholder="team@fuelcheck.io" required autocomplete="email">
                    </div>
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">*</span>
                        <input type="password" id="registerPassword" placeholder="Create a password" required autocomplete="new-password">
                        <button type="button" class="field-eye" data-toggle-password="registerPassword" aria-label="Show password">
                            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a17.8 17.8 0 0 1 5.06-5.94"/><path d="M1 1l22 22"/><path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88"/></svg>
                        </button>
                    </div>
                </label>
                <button type="submit" class="primary-btn">Create Account</button>
                <div id="registerError" class="auth-error d-none" role="alert"></div>
            </form>
        </section>
    </div>
</main>
<script src="{% static 'js/login.js' %}"></script>
</body>
</html>
