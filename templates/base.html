{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1a2a">
    <title>{% block title %}Fuel Check{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-VkTXQbN4Z1CkzFZlF4l6R1Q6l0e6QF6UVx/F4SkzE7d1DEuDfSUdifYEJOCSsfQF" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="app-body">
<div class="background-gradient"></div>
<div class="background-accent accent-1"></div>
<div class="background-accent accent-2"></div>
<div class="page-wrapper d-flex flex-column min-vh-100">
    <header class="app-header">
        <nav class="navbar navbar-expand-lg navbar-dark glass-nav">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="/dashboard">Fuel Check</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item" data-auth="true">
                            <a class="nav-link" href="/dashboard">Dashboard</a>
                        </li>
                        <li class="nav-item" data-auth="true">
                            <a class="nav-link" href="/dashboard#vehicles">Vehicles</a>
                        </li>
                        <li class="nav-item" data-auth="false">
                            <a class="nav-link" href="/login">Login</a>
                        </li>
                        <li class="nav-item" data-auth="false">
                            <a class="nav-link" href="/register">Register</a>
                        </li>
                        <li class="nav-item ms-lg-3" data-auth="true">
                            <button class="btn btn-sm btn-ghost-light" type="button" id="logoutBtn">Logout</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        <div class="container content-shell py-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer text-center text-white-50 py-4">
        <div class="container small">
            <span>&copy; {% now "Y" %} Fuel Check. Keep your journeys efficient.</span>
        </div>
    </footer>
</div>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div id="toastContainer" class="toast-container"></div>
</div>

<div id="globalLoader" class="global-loader d-none" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6lpP8aA1gqXnNH5idAGHo82L1T9/1dQ8F5r5p5U5L5Q5" crossorigin="anonymous"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
