{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Fuel Check</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/common.css' %}" rel="stylesheet">
    <link href="{% static 'css/dash.css' %}" rel="stylesheet">
</head>
<body class="dashboard-body">
<div class="dashboard-aurora"></div>
<div class="dashboard-noise"></div>

<!-- Navbar -->
<nav class="dash-navbar">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/dashboard" class="nav-brand">
                <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span class="brand-text">Fuel Check</span>
            </a>
        </div>
        <div class="nav-center">
            <a href="/dashboard" class="nav-link active">Dashboard</a>
        </div>
        <div class="nav-right">
            <button id="logoutBtn" class="nav-logout" title="Sign out">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </div>
</nav>

<main class="dash-main">
    <!-- Hero -->
    <div class="dash-hero">
        <div class="hero-text">
            <span class="hero-eyebrow">Dashboard</span>
            <h1 class="hero-title">My Vehicles</h1>
            <p class="hero-subtitle">Track fuel consumption, mileage, and expenses across your fleet.</p>
        </div>
        <button class="hero-add-btn" data-bs-toggle="modal" data-bs-target="#vehicleModal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Vehicle
        </button>
    </div>

    <!-- Summary Stats -->
    <div id="summaryStats" class="summary-strip"></div>

    <!-- Toolbar -->
    <div class="dash-toolbar">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="vehicleSearch" class="search-input" placeholder="Search by name, registration, model..." autocomplete="off">
            <button class="search-clear" id="searchClear" style="display:none" aria-label="Clear search">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <span class="vehicle-count" id="vehicleCount"></span>
    </div>

    <!-- Vehicle Grid -->
    <div id="vehiclesList"></div>
</main>

<!-- Vehicle Modal -->
<div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content vehicle-modal">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h5 class="modal-title" id="vehicleModalLabel">Add Vehicle</h5>
                    <p class="modal-subtitle">Fill in the details below</p>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="vehicleForm">
                    <input type="hidden" id="vehicleId">
                    
                    <!-- Required Fields Section -->
                    <div class="form-section">
                        <h6 class="section-title">
                            <span class="section-icon">*</span>
                            Required Information
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="regno" class="form-label">Registration No.</label>
                                <input type="text" class="form-control" id="regno" placeholder="e.g., MH01AB1234" required>
                            </div>
                            <div class="col-md-6">
                                <label for="name" class="form-label">Vehicle Name</label>
                                <input type="text" class="form-control" id="name" placeholder="e.g., My Car" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fuel_type" class="form-label">Fuel Type</label>
                                <select class="form-select" id="fuel_type" required>
                                    <option value="">Select fuel type</option>
                                    <option value="petrol">Petrol</option>
                                    <option value="diesel">Diesel</option>
                                    <option value="cng">CNG</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="fuel_tank_capacity" class="form-label">Fuel Tank Capacity (L)</label>
                                <input type="number" step="0.01" class="form-control" id="fuel_tank_capacity" placeholder="e.g., 45" required>
                            </div>
                        </div>
                    </div>

                    <!-- Optional Fields Section -->
                    <div class="form-section optional-section">
                        <h6 class="section-title">
                            <span class="section-icon">+</span>
                            Optional Details
                            <button type="button" class="btn btn-sm btn-outline-light ms-auto" id="carLookupBtn" style="border-radius:999px;font-size:0.7rem;text-transform:none;letter-spacing:0">🔍 Lookup Car</button>
                        </h6>
                        <div id="carLookupPanel" style="display:none;margin-bottom:1rem;padding:0.75rem;background:rgba(255,255,255,0.03);border-radius:0.75rem;border:1px solid var(--border)">
                            <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem">
                                <input type="text" id="carMakeInput" placeholder="Make (e.g. Toyota)" style="flex:1;background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:0.5rem;padding:0.4rem 0.7rem;font-size:0.8rem">
                                <input type="text" id="carModelInput" placeholder="Model" style="flex:1;background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:0.5rem;padding:0.4rem 0.7rem;font-size:0.8rem">
                                <input type="text" id="carYearInput" placeholder="Year" style="width:70px;background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:0.5rem;padding:0.4rem 0.7rem;font-size:0.8rem">
                                <button type="button" class="btn btn-sm btn-primary" id="carFetchBtn" style="border-radius:999px;padding:0.3rem 0.8rem;font-size:0.75rem">Fetch</button>
                            </div>
                            <div id="carLookupStatus" style="font-size:0.75rem;color:var(--text-muted)"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="model" class="form-label optional-label">Model</label>
                                <input type="text" class="form-control" id="model" placeholder="e.g., Swift">
                            </div>
                            <div class="col-md-6">
                                <label for="company" class="form-label optional-label">Company</label>
                                <input type="text" class="form-control" id="company" placeholder="e.g., Maruti Suzuki">
                            </div>
                            <div class="col-md-6">
                                <label for="color" class="form-label optional-label">Color</label>
                                <input type="text" class="form-control" id="color" placeholder="e.g., Red">
                            </div>
                            <div class="col-md-6">
                                <label for="total_kms_driven" class="form-label optional-label">Total KMs Driven</label>
                                <input type="number" step="0.01" class="form-control" id="total_kms_driven" placeholder="e.g., 50000">
                            </div>
                            <div class="col-md-6">
                                <label for="last_service_date" class="form-label optional-label">Last Service Date</label>
                                <div class="date-input-wrapper">
                                    <input type="date" class="form-control" id="last_service_date">
                                    <span class="date-icon">📅</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="current_mileage" class="form-label optional-label">Current Mileage (km/L)</label>
                                <input type="number" step="0.01" class="form-control" id="current_mileage" placeholder="e.g., 18.5">
                            </div>
                            <div class="col-md-6">
                                <label for="average_mileage" class="form-label optional-label">Average Mileage (km/L)</label>
                                <input type="number" step="0.01" class="form-control" id="average_mileage" placeholder="e.g., 20.0">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Vehicle Details Modal -->
<div class="modal fade" id="vehicleDetailsModal" tabindex="-1" aria-labelledby="vehicleDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content vehicle-modal">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h5 class="modal-title" id="vehicleDetailsModalLabel">Vehicle Details</h5>
                    <p class="modal-subtitle">Complete vehicle information</p>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="vehicleDetailsBody">
                <!-- Details will be injected by JS -->
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/toast.js' %}"></script>
<script src="{% static 'js/dash.js' %}"></script>
</body>
</html>
