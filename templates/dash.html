{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Fuel Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/dash.css' %}" rel="stylesheet">
</head>
<body class="dashboard-body">
<div class="dashboard-aurora"></div>
<div class="dashboard-noise"></div>
<div class="container py-5 dashboard-content">
    <div class="dashboard-header mb-5">
        <div>
            <p class="eyebrow text-uppercase mb-2">Fuel Check</p>
            <h2 class="display-6 fw-bold mb-2">My Vehicles</h2>
            <p class="lead text-muted mb-0">Tap into any card to review its transactions, stats, and fueling story.</p>
        </div>
        <div class="d-flex flex-wrap gap-3">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#vehicleModal">Add Vehicle</button>
            <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
        </div>
    </div>
    <div id="vehiclesList" class="row g-4"></div>
</div>
<!-- Vehicle Modal -->
<div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content vehicle-modal">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h5 class="modal-title" id="vehicleModalLabel">Add Vehicle</h5>
                    <p class="modal-subtitle">Fill in the details below</p>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="vehicleForm">
                    <input type="hidden" id="vehicleId">
                    
                    <!-- Required Fields Section -->
                    <div class="form-section">
                        <h6 class="section-title">
                            <span class="section-icon">*</span>
                            Required Information
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="regno" class="form-label">Registration No.</label>
                                <input type="text" class="form-control" id="regno" placeholder="e.g., MH01AB1234" required>
                            </div>
                            <div class="col-md-6">
                                <label for="name" class="form-label">Vehicle Name</label>
                                <input type="text" class="form-control" id="name" placeholder="e.g., My Car" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fuel_type" class="form-label">Fuel Type</label>
                                <select class="form-select" id="fuel_type" required>
                                    <option value="">Select fuel type</option>
                                    <option value="petrol">Petrol</option>
                                    <option value="diesel">Diesel</option>
                                    <option value="cng">CNG</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="fuel_tank_capacity" class="form-label">Fuel Tank Capacity (L)</label>
                                <input type="number" step="0.01" class="form-control" id="fuel_tank_capacity" placeholder="e.g., 45" required>
                            </div>
                        </div>
                    </div>

                    <!-- Optional Fields Section -->
                    <div class="form-section optional-section">
                        <h6 class="section-title">
                            <span class="section-icon">+</span>
                            Optional Details
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="model" class="form-label optional-label">Model</label>
                                <input type="text" class="form-control" id="model" placeholder="e.g., Swift">
                            </div>
                            <div class="col-md-6">
                                <label for="company" class="form-label optional-label">Company</label>
                                <input type="text" class="form-control" id="company" placeholder="e.g., Maruti Suzuki">
                            </div>
                            <div class="col-md-6">
                                <label for="color" class="form-label optional-label">Color</label>
                                <input type="text" class="form-control" id="color" placeholder="e.g., Red">
                            </div>
                            <div class="col-md-6">
                                <label for="total_kms_driven" class="form-label optional-label">Total KMs Driven</label>
                                <input type="number" step="0.01" class="form-control" id="total_kms_driven" placeholder="e.g., 50000">
                            </div>
                            <div class="col-md-6">
                                <label for="last_service_date" class="form-label optional-label">Last Service Date</label>
                                <div class="date-input-wrapper">
                                    <input type="date" class="form-control" id="last_service_date">
                                    <span class="date-icon">📅</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="current_mileage" class="form-label optional-label">Current Mileage (km/L)</label>
                                <input type="number" step="0.01" class="form-control" id="current_mileage" placeholder="e.g., 18.5">
                            </div>
                            <div class="col-md-6">
                                <label for="average_mileage" class="form-label optional-label">Average Mileage (km/L)</label>
                                <input type="number" step="0.01" class="form-control" id="average_mileage" placeholder="e.g., 20.0">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Vehicle Details Modal -->
<div class="modal fade" id="vehicleDetailsModal" tabindex="-1" aria-labelledby="vehicleDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content vehicle-modal">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h5 class="modal-title" id="vehicleDetailsModalLabel">Vehicle Details</h5>
                    <p class="modal-subtitle">Complete vehicle information</p>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="vehicleDetailsBody">
                <!-- Details will be injected by JS -->
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/dash.js' %}"></script>
</body>
</html>
